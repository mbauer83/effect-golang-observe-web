<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>effect-golang inspector</title>
<style>
  :root {
    color-scheme: light dark;
    --ground: #fbfbfa;
    --panel: #ffffff;
    --edge: #e3e2df;
    --ink: #1a1a18;
    --quiet: #6b6a66;
    --accent: #2f5d50;
    --bad: #9b2c2c;
    --warn: #8a5a00;
    --open: #2b4c7e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #16181a;
      --panel: #1d2022;
      --edge: #2f3336;
      --ink: #e6e6e3;
      --quiet: #9a9a95;
      --accent: #7fbfa9;
      --bad: #e08a8a;
      --warn: #d8b166;
      --open: #8fb3e0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 2;
    display: flex; flex-wrap: wrap; gap: 1rem; align-items: baseline;
    padding: 0.9rem 1.2rem;
    background: var(--panel);
    border-bottom: 1px solid var(--edge);
  }
  h1 { margin: 0; font-size: 1rem; font-weight: 650; letter-spacing: 0.01em; }
  .meta { color: var(--quiet); font-size: 0.82rem; }
  .controls { margin-left: auto; display: flex; gap: 0.6rem; align-items: center; }
  .controls label { display: flex; gap: 0.25rem; align-items: center; cursor: pointer; }
  button, select {
    font: inherit; font-size: 0.82rem;
    color: var(--ink); background: var(--ground);
    border: 1px solid var(--edge); border-radius: 6px;
    padding: 0.25rem 0.6rem; cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--accent); }
  main {
    display: grid; gap: 1rem; padding: 1.2rem;
    grid-template-columns: repeat(auto-fit, minmax(28rem, 1fr));
    align-items: start;
  }
  section {
    background: var(--panel);
    border: 1px solid var(--edge); border-radius: 8px;
    padding: 0.9rem 1rem 1rem;
    min-width: 0;
  }
  h2 {
    margin: 0 0 0.7rem; font-size: 0.78rem; font-weight: 650;
    text-transform: uppercase; letter-spacing: 0.06em; color: var(--quiet);
  }
  .empty { color: var(--quiet); font-style: italic; }
  /* Every panel whose content varies holds its size and scrolls inside it.
     A panel that grew from four rows to nine moved everything below it in its
     column, which put the thing being read somewhere else between one refresh
     and the next -- so the panels are the fixed part and the content is what
     moves. */
  .scroll { overflow: auto; height: 17rem; }
  .scroll.short { height: 9rem; }
  /* The selected name's own box: what every run of it cost, which is the
     question the span details deliberately do not answer. */
  #account { height: 20rem; }
  #account .name { margin-bottom: 0.3rem; }
  #account dl { display: grid; grid-template-columns: 14rem minmax(0, 1fr); gap: 0.1rem 0.7rem; margin: 0 0 0.5rem; }
  #account dt { color: var(--quiet); }
  #account dd { margin: 0; font-variant-numeric: tabular-nums; }
  tr.chosen td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  tr[aria-current="true"] td:first-child { font-weight: 650; }
  #fibers, #open { height: 11rem; overflow-y: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
  th, td { text-align: left; padding: 0.28rem 0.5rem 0.28rem 0; white-space: nowrap; }
  th { color: var(--quiet); font-weight: 550; border-bottom: 1px solid var(--edge); }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .tree { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.82rem; }
  .span { padding: 0.1rem 0; }
  .name { font-weight: 600; }
  .took { color: var(--quiet); }
  .status-success { color: var(--accent); }
  .status-typed_failure, .status-defect { color: var(--bad); }
  .status-interrupted { color: var(--warn); }
  .status-open { color: var(--open); font-weight: 600; }
  .event { color: var(--quiet); }
  .pill {
    display: inline-block; border: 1px solid var(--edge); border-radius: 999px;
    padding: 0 0.45rem; font-size: 0.72rem; color: var(--quiet);
  }
  .fault { color: var(--bad); }

  /* The waterfall. A bar's offset and width are the span's start and
     duration, which is the visualization every tracing tool converges on:
     nesting says what contained what, and only a timeline says what waited. */
  .waterfall { display: grid; grid-template-columns: minmax(9rem, auto) 1fr; gap: 0 0.7rem; align-items: center; }
  .waterfall .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track { position: relative; height: 1.05rem; background: color-mix(in srgb, var(--edge) 40%, transparent); border-radius: 3px; }
  .bar { position: absolute; top: 0; bottom: 0; min-width: 2px; border-radius: 3px; background: var(--accent); opacity: 0.85; }
  .bar.status-typed_failure, .bar.status-defect { background: var(--bad); }
  .bar.status-interrupted { background: var(--warn); }
  .bar.status-open { background: repeating-linear-gradient(90deg, var(--open) 0 6px, transparent 6px 10px); }
  .attrs { color: var(--quiet); font-size: 0.76rem; }
  .attrs .pill { margin-right: 0.3rem; }
  .age { font-variant-numeric: tabular-nums; }

  /* Gauges and charts. Inline SVG and CSS, because the page carries no
     library: a chart drawn by a framework fetched from a CDN is a chart that
     does not appear on the machine you most need it on. */
  .gauges { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: 0.8rem; }
  .gauge .name { display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--quiet); font-weight: 550; }
  .gauge .value { font-size: 1.3rem; font-variant-numeric: tabular-nums; }
  .gauge .of { color: var(--quiet); font-size: 0.78rem; }
  .meter { height: 0.4rem; border-radius: 999px; background: color-mix(in srgb, var(--edge) 55%, transparent); overflow: hidden; margin-top: 0.3rem; display: flex; }
  .meter span { display: block; height: 100%; }
  .meter .used { background: var(--accent); }
  .meter .runnable { background: var(--warn); }
  .meter .waiting { background: color-mix(in srgb, var(--open) 55%, transparent); }
  .meter .gc { background: var(--bad); }
  .legend { color: var(--quiet); font-size: 0.72rem; margin-top: 0.2rem; }
  .charts { display: grid; gap: 0.9rem; }
  .chart .name { display: flex; justify-content: space-between; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--quiet); font-weight: 550; }
  .chart svg { display: block; width: 100%; height: 3.4rem; overflow: visible; }
  .chart .area { fill: color-mix(in srgb, var(--accent) 22%, transparent); }
  .chart .line { fill: none; stroke: var(--accent); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .chart.warm .area { fill: color-mix(in srgb, var(--warn) 22%, transparent); }
  .chart.warm .line { stroke: var(--warn); }
  .chart.cool .area { fill: color-mix(in srgb, var(--open) 22%, transparent); }
  .chart.cool .line { stroke: var(--open); }
  /* uPlot draws the time series: axes, a cursor that reads values off the
     series under the pointer, and a legend. Themed to the page rather than
     restyled, so a dark viewer gets a dark chart. */
  .uplot { width: 100%; }
  .u-title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--quiet); font-weight: 550; }
  .u-legend { font-size: 0.76rem; color: var(--quiet); }
  .u-legend .u-marker { border-radius: 2px; }
  .u-inline .u-series > * { padding: 0 0.3rem; }
  .u-over, .u-axis { color: var(--quiet); }

  /* The waterfall. No chart library draws a span waterfall -- rows of nested
     bars on a shared axis, with events marked on them -- so this is drawn
     here, with the axis and the details a chart library would have given. */
  /* Bounded, because a busy program produces more traces than a panel can
     show and the newest are the ones being looked for. */
  .traces { display: grid; gap: 0.15rem; margin-bottom: 0.4rem; height: 20rem; overflow-y: auto; align-content: start; }
  .trace {
    display: grid; grid-template-columns: minmax(10rem, auto) 1fr auto;
    gap: 0.6rem; align-items: center;
    padding: 0.15rem 0.35rem; border-radius: 5px; cursor: pointer;
    border: 1px solid transparent; text-align: left; background: none;
    color: inherit; font: inherit;
  }
  .trace:hover { border-color: var(--edge); }
  .trace[aria-current="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
/* The axis shares the rows' grid, so a tick sits above the position it
     labels. Full width, it labelled the panel and not the bars. */
  .axis { display: grid; grid-template-columns: minmax(9rem, 14rem) 1fr; gap: 0.6rem; margin-bottom: 0.15rem; min-height: 1.15rem; }
  .axis .scale { position: relative; height: 1.15rem; border-bottom: 1px solid var(--edge); }
  .axis .tick { position: absolute; bottom: 0; font-size: 0.68rem; color: var(--quiet); white-space: nowrap; }
  .axis .tick::after { content: ""; position: absolute; left: 0; bottom: -0.3rem; height: 0.3rem; border-left: 1px solid var(--edge); }
  /* The ends are pulled inside, so neither label is clipped by the panel. */
  .axis .tick.first { transform: none; }
  .axis .tick.last { transform: translateX(-100%); }
  .axis .tick.last::after { left: 100%; }
  .axis .tick.middle { transform: translateX(-50%); }
  .axis .tick.middle::after { left: 50%; }
  .row { display: grid; grid-template-columns: minmax(9rem, 14rem) 1fr; gap: 0.6rem; align-items: center; }
  #waterfall { height: 8.5rem; overflow-y: auto; }
  .row.reading .track { outline: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); outline-offset: 1px; }
  .row.chosen .track { outline: 1px solid var(--accent); outline-offset: 1px; }
  .row .track { cursor: pointer; }
/* A span that encloses others is hatched where it was working itself and
     solid where a child was, so the regions no child covers read as its own
     time rather than as gaps in the drawing. A span with no children is all
     its own time, so it stays plain: hatching everything said nothing. */
  .bar.divided { background-image: repeating-linear-gradient(135deg, transparent 0 3px, color-mix(in srgb, var(--panel) 60%, transparent) 3px 6px); }
  .covered { position: absolute; top: 0; bottom: 0; background: currentColor; opacity: 0.001; }
  .bar > .covered { background-image: none; background-color: color-mix(in srgb, var(--panel) 55%, transparent); opacity: 1; }
  .mark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: 0.55; }
  .mark.status-typed_failure, .mark.status-defect { background: var(--bad); opacity: 0.9; }
  .details { border-top: 1px dashed var(--edge); margin-top: 0.5rem; padding-top: 0.5rem; font-size: 0.8rem; height: 13rem; overflow-y: auto; }
  /* A fixed term column, because an automatic one is as wide as the longest
     term in the panel -- so a value arriving two seconds later rewrapped every
     line beside it. Values that have no natural break, a path and an identity,
     are cut rather than wrapped. */
  .details dl { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); gap: 0.1rem 0.7rem; margin: 0.3rem 0 0; }
  .details dt { color: var(--quiet); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .details dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .details dd.whole { overflow-wrap: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .details .events { margin: 0.4rem 0 0; padding: 0; list-style: none; color: var(--quiet); }

  /* Hot paths: the same arithmetic a flame graph does -- a span's duration
     less its children's -- ranked, because a ranked list reads in a panel
     and a flame graph needs a page. */
  .hot { display: grid; gap: 0.25rem; height: 20rem; overflow-y: auto; align-content: start; }
  .hot .row { grid-template-columns: minmax(12rem, 22rem) 1fr auto; }
  .hot .path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hot .path .leaf { font-weight: 650; }
  .hot .share { font-size: 0.78rem; color: var(--quiet); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hot .bar { position: relative; }
  .caveat { color: var(--quiet); font-size: 0.76rem; margin: 0.2rem 0 0.6rem; min-height: 1.5em; }
  /* A line that has something to say only sometimes still occupies its place
     when it does not, so saying it moves nothing below it. */
  #loose, #owned { min-height: 1.5em; margin: 0.3rem 0 0; }
  /* Progressive disclosure: the bytes and the count in the row, the shapes
     they were behind a click. */
  tr.selectable td { cursor: pointer; }
  tr.sizes td { padding-top: 0; padding-bottom: 0.4rem; }
  .classes { display: grid; grid-template-columns: auto 1fr auto; gap: 0.05rem 0.5rem; font-size: 0.76rem; color: var(--quiet); }
  .classes .edge { font-variant-numeric: tabular-nums; text-align: right; }
  .classes .weight { height: 0.5rem; align-self: center; background: color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 2px; }
  a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  a:hover { color: var(--ink); }
</style>
</head>
<body>
<header>
  <h1>effect-golang inspector</h1>
  <a class="meta" id="app" href="/">the app &rarr;</a>
  <span class="meta" id="taken">reading…</span>
  <span class="meta" id="dropped"></span>
  <span class="meta fault" id="fault"></span>
  <div class="controls">
    <label class="meta"><input type="checkbox" id="own"> its own traffic</label>
    <select id="every" aria-label="Refresh interval">
      <option value="1000">every 1s</option>
      <option value="2000" selected>every 2s</option>
      <option value="5000">every 5s</option>
      <option value="0">paused</option>
    </select>
    <button id="now" type="button">Read now</button>
  </div>
</header>

<main>
  <section>
    <h2>Process</h2>
    <div class="gauges" id="gauges"></div>
    <div class="charts" id="charts"></div>
  </section>
  <section>
    <h2>Cost by name</h2>
    <p class="caveat" id="costcaveat"></p>
    <div class="scroll short"><table id="costs"></table></div>
    <div class="details" id="account">
      <div class="name" id="accountname"></div>
      <dl id="accountfacts"></dl>
      <div id="accountbands"></div>
      <div id="accountchart"></div>
    </div>
  </section>
  <section>
    <h2>Fibers</h2>
    <div id="fibers" class="tree"></div>
    <p class="meta" id="owned"></p>
  </section>
  <section>
    <h2>Open spans</h2>
    <div id="open" class="tree"></div>
  </section>
  <section>
    <h2>Traces</h2>
    <p class="caveat" id="hidden"></p>
    <div class="traces" id="traces"></div>
    <p class="meta" id="loose"></p>
  </section>
  <section>
    <h2>Hot paths</h2>
    <p class="caveat">self time, all traces in the window</p>
    <div class="hot" id="hot"></div>
  </section>
  <section>
    <h2>Timeline</h2>
    <p class="caveat" id="gone"></p>
    <div class="axis" id="axis"></div>
    <div id="waterfall"></div>
    <div class="details" id="details"></div>
  </section>
  <section>
    <h2>Measurements</h2>
    <div class="scroll"><table id="measurements"></table></div>
  </section>
  <section>
    <h2>Surface</h2>
    <div class="scroll"><table id="routes"></table></div>
  </section>
</main>

<script>
// The snapshot lives beside this page, whatever the inspector was mounted
// under: the page is served at <at> and the reading at <at>/snapshot, so the
// mount point never has to be baked in.
const mounted = location.pathname.replace(/\/$/, "");
const source = mounted + "/snapshot";

const el = (id) => document.getElementById(id);
const text = (value) => document.createTextNode(String(value));

function tagged(tag, className, content) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (content !== undefined) node.appendChild(text(content));
  return node;
}

// at renders a position on a timeline, where zero is the start: "-" or an
// empty string there says the first span had no beginning.
function at(value) {
  return value ? micros(value) : "0";
}

function micros(value) {
  if (!value) return "";
  if (value < 1000) return value + "µs";
  if (value < 1000000) return (value / 1000).toFixed(value < 10000 ? 2 : 1) + "ms";
  return (value / 1000000).toFixed(2) + "s";
}

function statusClass(span) {
  return span.open ? "status-open" : "status-" + (span.status || "unclassified");
}

// The inspector's own requests are observed like everything else -- a tool's
// load is part of what a program is doing, and hiding it would be the one
// measurement nobody could check. But it refreshes every couple of seconds, so
// left in the trace panels it drowns the traffic somebody opened this to look
// at: hundreds of its own traces against a handful of the application's.
//
// So the traces are filtered here and the statistics are not. The count of
// what was hidden is shown, because a filter nobody can see is a lie.
function ownTrace(trace) {
  const held = trace.root.attributes || [];
  for (const attribute of held) {
    if (attribute.key === "route") {
      return attribute.value === mounted || attribute.value.startsWith(mounted + "/");
    }
  }
  // No route annotation: not one of ours, so it stays.
  return false;
}

// Hot paths: every span in the window aggregated by the chain of names that
// reaches it, ranked by the time its own body took.
//
// Self time and not total, which is the whole point: a route that spends all
// of itself inside one stage is not hot, the stage is. Summed across traces,
// so a stage that is fast once and runs two hundred times ranks above one
// that is slow once -- which is the question "where does the time go" actually
// asking.
function hotPaths(traces) {
  const held = new Map();
  for (const trace of traces) {
    const chain = [];
    for (const span of trace.spans) {
      chain.length = span.depth;
      chain[span.depth] = span.name || "(unnamed)";
      const path = chain.slice(0, span.depth + 1).join(" \u203a ");
      const found = held.get(path) || { path: path, runs: 0, self: 0, total: 0 };
      found.runs += 1;
      found.self += span.selfMicros;
      found.total += span.open ? span.ageMicros : span.micros;
      held.set(path, found);
    }
  }
  const ranked = [...held.values()];
  ranked.sort((first, second) => second.self - first.self);
  return ranked;
}

function renderHot(into, traces) {
  into.replaceChildren();
  const ranked = hotPaths(traces);
  if (ranked.length === 0) {
    into.appendChild(tagged("p", "empty", "nothing in the window"));
    return;
  }
  const hottest = ranked[0].self || 1;
  const everything = ranked.reduce((sum, one) => sum + one.self, 0) || 1;

  for (const one of ranked.slice(0, 12)) {
    const row = tagged("div", "row");
    const path = tagged("div", "path");
    const parts = one.path.split(" \u203a ");
    const leaf = parts.pop();
    if (parts.length) path.appendChild(tagged("span", null, parts.join(" \u203a ") + " \u203a "));
    path.appendChild(tagged("span", "leaf", leaf));
    path.title = one.path;
    row.appendChild(path);

    const track = tagged("div", "track");
    const bar = tagged("div", "bar status-success");
    bar.style.left = "0";
    bar.style.width = Math.max(0.8, 100 * one.self / hottest) + "%";
    bar.title = micros(one.self) + " of its own over " + one.runs + " run(s)";
    track.appendChild(bar);
    row.appendChild(track);

    row.appendChild(tagged("div", "share",
      micros(one.self) + "  " + percent(one.self / everything) +
      "  \u00d7" + one.runs));
    into.appendChild(row);
  }
}

// The traces, and one of them on a timeline.
//
// A reading's spans arrive flat, in reading order, with a depth: a depth of
// zero starts a trace and everything deeper belongs to it. Grouping them here
// rather than on the wire keeps the description free of a recursive shape.
function tracesOf(spans) {
  const traces = [];
  for (const span of spans || []) {
    if (span.depth === 0 || traces.length === 0) {
      traces.push({ root: span, spans: [span] });
      continue;
    }
    traces[traces.length - 1].spans.push(span);
  }
  return traces;
}

// A trace's own window: from its first span to the end of its last, so the
// bars are scaled to the trace and not to the whole reading. Scaling to the
// reading is what made every bar a hairline -- a reading spans the minutes
// between requests and a request spans microseconds.
function windowOf(trace) {
  let from = Infinity;
  let to = 0;
  for (const span of trace.spans) {
    from = Math.min(from, span.startMicros);
    to = Math.max(to, span.startMicros + (span.open ? span.ageMicros : span.micros));
  }
  if (!isFinite(from)) return { from: 0, to: 1 };
  // A trace of one instantaneous span still needs a width to draw in.
  return { from: from, to: Math.max(to, from + 1) };
}

// The chosen trace is remembered by its root span's identity and not by its
// position: traces arrive newest first, so an index points at a different
// trace two seconds later and the panel shifted under whoever was reading it.
//
// Its spans are remembered too. The window holds a few hundred events, so a
// trace somebody is reading falls out of it within a minute or two -- and a
// timeline that emptied itself at that moment would be a timeline nobody could
// finish looking at. It is kept until another is chosen, and says it is no
// longer in the window.
let chosen = { root: null, span: null, pinned: false, kept: null, measured: {} };

// A reload is not a change of mind, so the choice outlives the page. Two keys
// rather than one: which trace and span were chosen, and the trace itself.
//
// Separate, because they are written at different times and for different
// reasons. The choice is two numbers and is rewritten whenever it changes; the
// copy is the whole trace and is written when the trace is chosen and while it
// is still in the window, so what survives the trace falling out is the trace
// as it finished. The copy is replaced when another trace is chosen and
// removed when the choice is, and at no other time -- a trace nobody has
// deselected is a trace somebody is still reading.
//
// Every access is guarded: a browser with storage denied still runs the
// inspector, it just forgets between loads.
const remembered = "effect-golang-inspect-chosen";
const keptTrace = "effect-golang-inspect-kept-trace";

function remember() {
  try {
    if (chosen.root === null) {
      localStorage.removeItem(remembered);
      localStorage.removeItem(keptTrace);
      return;
    }
    localStorage.setItem(remembered, JSON.stringify({
      root: chosen.root, span: chosen.span,
      pinned: !!chosen.pinned, measured: chosen.measured || {},
    }));
    if (chosen.kept) localStorage.setItem(keptTrace, JSON.stringify(chosen.kept));
  } catch (whatever) { /* storage denied; the choice lives for this page */ }
}

function recall() {
  try {
    const held = JSON.parse(localStorage.getItem(remembered) || "null");
    if (!held || held.root === null || held.root === undefined) return;
    chosen = {
      root: held.root,
      span: held.span === undefined ? null : held.span,
      pinned: !!held.pinned,
      measured: held.measured || {},
      kept: JSON.parse(localStorage.getItem(keptTrace) || "null"),
    };
  } catch (whatever) { /* unreadable or absent; the default stands */ }
}

recall();

// A trace worth arriving on: the newest one that has something to decompose,
// or the newest at all. Defaulting to the first showed a timeline of one bar,
// which is the panel's least useful state.
function defaultTrace(traces) {
  const decomposable = traces.findIndex((trace) => trace.spans.length > 1);
  return decomposable >= 0 ? decomposable : 0;
}

// chosenIn is the trace the panels are showing: the one whose identity was
// chosen if it is still in the window, otherwise the copy kept of it, and
// otherwise the default.
function chosenIn(traces) {
  if (chosen.root !== null) {
    const at = traces.findIndex((trace) => trace.root.id === chosen.root);
    if (at >= 0) {
      // Refreshed while it is still in the window, so what is held once it
      // falls out is the trace as it finished rather than as it began -- and
      // with what its spans measured, which leaves the window before the
      // trace does.
      const grew = !chosen.kept || chosen.kept.spans.length !== traces[at].spans.length;
      chosen.kept = traces[at];
      const found = keepMeasured(traces[at]);
      if (grew || found) remember();
      return { trace: traces[at], at: at, held: true };
    }
  }
  if (chosen.kept) {
    return { trace: chosen.kept, at: -1, held: false };
  }
  const at = defaultTrace(traces);
  return { trace: traces[at], at: at, held: true };
}

function renderTraces(into, traces, showing) {
  into.replaceChildren();
  if (traces.length === 0) {
    into.appendChild(tagged("p", "empty", "none in the window"));
    return;
  }
  // Newest first: the trace worth looking at is usually the last thing that
  // happened.
  traces.forEach((trace, index) => {
    const held = windowOf(trace);
    const row = document.createElement("button");
    row.type = "button";
    row.className = "trace";
    row.setAttribute("aria-current", String(index === showing.at));
    row.appendChild(tagged("span", "name", trace.root.name || "(unnamed)"));
    const took = trace.root.open
      ? tagged("span", statusClass(trace.root), "open " + micros(trace.root.ageMicros))
      : tagged("span", statusClass(trace.root),
          micros(held.to - held.from) + " " + (trace.root.status || "unclassified"));
    row.appendChild(took);
    row.appendChild(tagged("span", "took",
      trace.spans.length + " span" + (trace.spans.length === 1 ? "" : "s")));
    row.addEventListener("click", () => {
      // A different trace is a different set of measurements.
      chosen = {
        root: trace.root.id, span: null, pinned: false,
        kept: trace, measured: {},
      };
      remember();
      el("waterfall").dataset.drew = "";
      redraw();
    });
    into.appendChild(row);
  });
}

// The axis: four ticks across the chosen trace's window, so a bar's position
// means something. Rounded to a readable step rather than to quarters of an
// arbitrary number.
function renderAxis(into, held) {
  into.replaceChildren();
  into.appendChild(tagged("div", "label"));
  const scale = tagged("div", "scale");
  const width = held.to - held.from;
  for (let index = 0; index <= 4; index++) {
    const where = index === 0 ? "first" : (index === 4 ? "last" : "middle");
    const tick = tagged("div", "tick " + where, at(Math.round((index / 4) * width)));
    tick.style.left = (100 * index / 4) + "%";
    scale.appendChild(tick);
  }
  into.appendChild(scale);
}

// childrenOf are the spans directly under the one at index, read off the flat
// list: the next entries one level deeper, until something at that level or
// above ends the run.
function childrenOf(spans, index) {
  const depth = spans[index].depth;
  const held = [];
  for (let at = index + 1; at < spans.length; at++) {
    if (spans[at].depth <= depth) break;
    if (spans[at].depth === depth + 1) held.push(spans[at]);
  }
  return held;
}

function renderWaterfall(into, details, showing, accounted) {
  const trace = showing.trace;
  if (!trace) {
    el("axis").replaceChildren();
    into.replaceChildren();
    details.replaceChildren();
    into.appendChild(tagged("p", "empty", "nothing to draw"));
    return;
  }
  el("gone").textContent = showing.held ? "" : "no longer in the window";
  const held = windowOf(trace);
  const width = held.to - held.from;

  // A finished trace is finished: its bars will never move again, so redrawing
  // them every two seconds only takes the row out from under whoever is
  // pointing at it. Drawn once, and again when something about it has actually
  // changed -- a span was added, it fell out of the window, or it is still
  // open and therefore still growing.
  const growing = trace.spans.some((span) => span.open);
  const drew = [trace.root.id, trace.spans.length, showing.held,
    growing ? Date.now() : "finished"].join(":");
  if (into.dataset.drew !== drew) {
    into.dataset.drew = drew;
    drawSpans(into, details, trace, held, width);
  }

  // The details are read from the newest snapshot even when the rows were not
  // redrawn: what a span cost is still accumulating while the bars stand
  // still.
  const kept = trace.spans.find((span) => span.id === chosen.span) || trace.spans[0];
  showDetails(details, kept, held, accounted);
}

// mark says which row the details belong to, and whether it is pinned there.
function mark(into, id) {
  for (const row of into.querySelectorAll(".row")) {
    const mine = Number(row.dataset.span) === id;
    row.classList.toggle("reading", mine);
    row.classList.toggle("chosen", mine && !!chosen.pinned);
  }
}

function drawSpans(into, details, trace, held, width) {
  el("axis").replaceChildren();
  into.replaceChildren();
  renderAxis(el("axis"), held);

  trace.spans.forEach((span, index) => {
    const mine = chosen.span === span.id;
    const row = tagged("div", "row" +
      (mine ? " reading" : "") + (mine && chosen.pinned ? " chosen" : ""));
    row.dataset.span = String(span.id);
    const label = tagged("div", "label");
    label.style.paddingLeft = (span.depth * 0.8) + "rem";
    label.appendChild(tagged("span", "name", span.name || "(unnamed)"));
    row.appendChild(label);

    const track = tagged("div", "track");
    const took = span.open ? span.ageMicros : span.micros;
    const bar = tagged("div", "bar " + statusClass(span));
    bar.style.left = (100 * (span.startMicros - held.from) / width) + "%";
    bar.style.width = Math.max(0.8, 100 * took / width) + "%";
    // Where its children ran, marked on its own bar: what is left is the
    // span's own time, which is otherwise indistinguishable from a gap in
    // the drawing.
    const children = childrenOf(trace.spans, index);
    if (children.length > 0) bar.classList.add("divided");
    for (const child of children) {
      const over = tagged("div", "covered");
      over.style.left = (100 * (child.startMicros - span.startMicros) / took) + "%";
      over.style.width = Math.max(0.5,
        100 * (child.open ? child.ageMicros : child.micros) / took) + "%";
      bar.appendChild(over);
    }
    track.appendChild(bar);

    // Events as marks on the bar's own timeline, which is what an event's
    // offset is for: a list says what happened and a mark says when.
    for (const event of span.events || []) {
      const mark = tagged("div", "mark " + ("status-" + (event.status || "none")));
      mark.style.left = (100 * (event.atMicros - held.from) / width) + "%";
      mark.title = event.kind + (event.operation ? " " + event.operation : "");
      track.appendChild(mark);
    }

    // Hover reads a row, click pins it, and a pinned row stays pinned --
    // including while the pointer travels down across the other rows to reach
    // the details it is pinned for, which is the whole reason pinning exists.
    // Clicking it again releases it.
    //
    // The span is remembered by its identity and not by its position, so a
    // span added to an open trace does not move the choice to its neighbour.
    const show = (pinning) => {
      if (chosen.pinned && !pinning) return;
      chosen.span = span.id;
      if (pinning) {
        // Pinning a row is choosing the trace it is in, even where the trace
        // was the default rather than a click: the pin is what has to survive
        // the trace falling out of the window, and so is what it measured.
        chosen.root = trace.root.id;
        chosen.kept = trace;
        chosen.pinned = true;
      }
      remember();
      mark(into, span.id);
      showDetails(details, span, held, (latest && latest.costs) || []);
    };
    row.addEventListener("mouseenter", () => show(false));
    row.addEventListener("click", () => {
      if (chosen.pinned && chosen.span === span.id) {
        chosen.pinned = false;
        remember();
        mark(into, span.id);
        return;
      }
      show(true);
    });
    row.appendChild(track);
    into.appendChild(row);
  });
}

// runWithin is the run this span is: the one whose measured window ended
// inside the span's own, which is what attributes a process-wide reading to
// one occurrence of a name.
//
// Go reports no per-goroutine allocation, so the figure is still what the
// *process* did while this span ran -- but during this span rather than during
// every span that ever shared its name, which is the difference between a
// number that stands still and an average that never does.
//
// The finalizer that takes the second reading runs inside the span, so the
// window's end precedes the span's by a hair. A microsecond of slack either
// way covers the rounding; an open span is matched against its age.
function runWithin(runs, span) {
  if (!runs || runs.length === 0) return null;
  const from = span.startMicros - 1;
  const to = span.startMicros + (span.open ? span.ageMicros : span.micros) + 1;
  for (const run of runs) {
    if (run.endedMicros < 0) continue;
    if (run.endedMicros >= from && run.endedMicros <= to) return run;
  }
  return null;
}

// keepMeasured records what each span of the chosen trace measured, while the
// runs that say so are still in the reading.
//
// A run is attributed by its window, and a window is placed against the
// earliest span in the reading -- so a run leaves the reading as soon as the
// trace it belonged to does, and sooner if the account's ring turns over
// first. A trace somebody is still looking at should not lose its numbers when
// that happens, so they are copied out while they are there.
//
// Returns whether anything new was found, which is what decides a write to
// storage.
function keepMeasured(trace) {
  let found = false;
  if (!chosen.measured) chosen.measured = {};
  for (const span of trace.spans) {
    if (chosen.measured[span.id]) continue;
    const account = ((latest && latest.costs) || [])
      .find((cost) => cost.name === span.name);
    const run = account ? runWithin(account.runs, span) : null;
    if (run) {
      chosen.measured[span.id] = run;
      found = true;
    }
  }
  return found;
}

// heldRun is what this span measured, from the copy kept above.
function heldRun(span) {
  if (!chosen.measured) return null;
  return chosen.measured[span.id] || null;
}

// showDetails is what a chart library's tooltip would have been, except that
// it holds still: name, where it was described, when it ran within the trace,
// what it ended as, what it was annotated with, and what happened inside it.
function showDetails(into, span, held, accounted) {
  into.replaceChildren();
  into.appendChild(tagged("div", "name", span.name || "(unnamed)"));
  const list = document.createElement("dl");
  const say = (term, value, whole) => {
    list.appendChild(tagged("dt", null, term));
    list.appendChild(tagged("dd", whole ? "whole" : null, value));
  };
  say("status", span.open ? "open" : (span.status || "unclassified"));
  say(span.open ? "open for" : "took",
    micros(span.open ? span.ageMicros : span.micros));
  if (!span.open && span.selfMicros !== span.micros) {
    say("of its own", micros(span.selfMicros) + "  " +
      percent(span.micros ? span.selfMicros / span.micros : 0));
  }
  say("began", "+" + at(span.startMicros - held.from));
  say("span", "#" + span.id + (span.parentId ? " under #" + span.parentId : " (root)"));
  if (span.trace) say("trace", span.trace, true);
  if (span.source) say("described", span.source, true);
  for (const attribute of span.attributes || []) {
    say(attribute.key, attribute.value);
  }
  into.appendChild(list);

  // What this span did, and nothing about the name it shares with others.
  //
  // The account keyed by name is an average over every run of it, and it moves
  // while the program runs -- so beside a trace that ended a minute ago it read
  // as this span still allocating. Averages are a question about a route, a
  // stage or a phase, and Cost by route is where that question is asked.
  const account = (accounted || []).find((cost) => cost.name === span.name);
  const own = account ? runWithin(account.runs, span) : null;
  const measured = own || heldRun(span);
  if (measured) {
    // Zero is a reading and not a blank: Go flushes a P's allocation
    // accounting in batches, so a span of a few microseconds often ends before
    // anything it allocated has been counted.
    say("allocated during", (measured.bytes ? bytes(measured.bytes) : "0 B") +
      " in " + measured.objects + " allocation(s)");
    say("measured over", micros(measured.micros));
  } else if (!account) {
    // Only a name something measured has an account at all: a route through
    // Observing, a stage through Measured, a phase through Sampling.
    say("allocation", "not measured");
  } else {
    say("allocation", "not held for this run");
  }

  const events = span.events || [];
  if (events.length === 0) return;
  const inside = tagged("ul", "events");
  for (const event of events) {
    let said = "+" + at(event.atMicros - held.from) + "  " + event.kind;
    if (event.operation) said += " " + event.operation;
    if (event.status) said += " " + event.status;
    if (event.attempt) said += " attempt " + event.attempt;
    inside.appendChild(tagged("li", null, said));
  }
  into.appendChild(inside);
}

function renderFibers(into, fibers) {
  into.replaceChildren();
  if (!fibers || fibers.length === 0) {
    into.appendChild(tagged("p", "empty", "none running"));
    return;
  }
  for (const fiber of fibers) {
    const line = tagged("div", "span");
    line.style.paddingLeft = (fiber.depth * 1.4) + "rem";
    line.appendChild(tagged("span", "name", "#" + fiber.id));
    line.appendChild(text(" running "));
    // Age first, as a fiber dump prints it: the number that identifies a stuck
    // program is how long something has been running.
    line.appendChild(tagged("span", "age", micros(fiber.ageMicros)));
    if (fiber.operation) {
      line.appendChild(tagged("span", "took", ", forked in " + fiber.operation));
    }
    into.appendChild(line);
  }
}

function bytes(value) {
  if (!value || value <= 0) return "-";
  if (value < 1024) return value + "B";
  if (value < 1048576) return (value / 1024).toFixed(1) + "KiB";
  if (value < 1073741824) return (value / 1048576).toFixed(1) + "MiB";
  return (value / 1073741824).toFixed(2) + "GiB";
}

function percent(share) {
  return (100 * (share || 0)).toFixed(1) + "%";
}

// A gauge: one number now, with the thing it should be read against.
function gauge(into, name, value, of, bars) {
  const held = tagged("div", "gauge");
  held.appendChild(tagged("span", "name", name));
  held.appendChild(tagged("div", "value", value));
  if (of) held.appendChild(tagged("div", "of", of));
  if (bars && bars.length) {
    const meter = tagged("div", "meter");
    // Shares of one whole, so a bar that would overflow is clamped rather
    // than allowed to run past the meter it is inside.
    let left = 100;
    for (const bar of bars) {
      const width = Math.max(0, Math.min(left, 100 * bar.share));
      left -= width;
      const part = tagged("span", bar.kind);
      part.style.width = width + "%";
      part.title = bar.title || "";
      meter.appendChild(part);
    }
    held.appendChild(meter);
    held.appendChild(tagged("div", "legend", bars.map((bar) => bar.legend)
      .filter(Boolean).join("  ")));
  }
  into.appendChild(held);
}

function renderGauges(into, process) {
  into.replaceChildren();
  if (!process || !process.sampled) {
    into.appendChild(tagged("p", "empty", "no series to sample"));
    return;
  }
  gauge(into, "heap", bytes(process.heapBytes),
    "of a " + bytes(process.goalBytes) + " goal \u00b7 " + process.heapObjects + " objects",
    [{ kind: "used", share: process.goalBytes ? process.heapBytes / process.goalBytes : 0,
       legend: "" }]);

  const goroutines = process.goroutines || 1;
  gauge(into, "goroutines", process.goroutines,
    "on " + process.threads + " thread(s)", [
      { kind: "used", share: process.running / goroutines,
        legend: process.running + " running" },
      { kind: "runnable", share: process.runnable / goroutines,
        legend: process.runnable + " runnable" },
      { kind: "waiting", share: process.waiting / goroutines,
        legend: process.waiting + " waiting" },
    ]);

  gauge(into, "busy", percent(process.busy),
    "of " + process.threads + " thread(s) over " + micros(process.overMicros), [
      { kind: "used", share: process.busy, legend: "" },
    ]);

  gauge(into, "collecting", percent(process.collecting),
    "of CPU used", [
      { kind: "gc", share: process.collecting, legend: process.gcCycles + " collections" },
    ]);

  gauge(into, "allocating", bytes(process.bytesPerSecond) + "/s",
    bytes(process.allocatedBytes) + " in window");

  gauge(into, "stacks", bytes(process.stackBytes),
    bytes(process.totalBytes) + " mapped");
}

// The charts are uPlot's: axes, a cursor that reads the value under the
// pointer off every series, and a legend. Drawn from the same points the
// snapshot carries, and rebuilt in place rather than recreated, so the cursor
// does not jump on a refresh.
const drawn = new Map();

function chartOf(into, key, title, series, values, options) {
  const width = into.clientWidth || 520;
  const quiet = colour("--quiet");
  const edge = colour("--edge");
  const held = drawn.get(key);
  if (held && held.plot) {
    held.plot.setSize({ width: width, height: options.height });
    held.plot.setData(values);
    return;
  }
  const panel = tagged("div", "chart");
  into.appendChild(panel);
  const plot = new uPlot({
    title: title,
    width: width,
    height: options.height,
    // The x values are seconds ago, so the axis reads as a window rather than
    // as a clock: a chart of the last two minutes says "-120s" to "0", and
    // nobody has to know when the program started.
    scales: { x: { time: false } },
    // The axes are drawn on a canvas, so their colour is an option here and
    // not a stylesheet rule: setting it in CSS left black labels on a dark
    // ground. Read from the page's tokens, so both themes are legible.
    axes: [
      { stroke: quiet, values: (self, ticks) => ticks.map((tick) => tick.toFixed(0) + "s"),
        grid: { show: false }, ticks: { stroke: edge, size: 3 } },
      { stroke: quiet, values: (self, ticks) => ticks.map(options.format),
        grid: { stroke: edge, width: 1, dash: [1, 3] },
        ticks: { stroke: edge, size: 3 }, size: options.axisWidth || 60 },
    ],
    cursor: { y: false, points: { size: 5 } },
    legend: { live: true },
    series: series,
  }, values, panel);
  drawn.set(key, { plot: plot });
}

function renderCharts(into, process) {
  if (typeof uPlot === "undefined") {
    into.replaceChildren(tagged("p", "empty", "chart library unavailable"));
    return;
  }
  const points = (process && process.points) || [];
  if (points.length < 2) {
    drawn.clear();
    into.replaceChildren(tagged("p", "empty", "two readings needed"));
    return;
  }
  if (into.querySelector(".empty")) into.replaceChildren();

  // Seconds ago, so the newest reading sits at zero on the right.
  const newest = points[points.length - 1].atMicros;
  const ago = points.map((point) => (point.atMicros - newest) / 1e6);

  chartOf(into, "memory", "memory", [
    when(),
    { label: "heap", stroke: colour("--accent"), fill: shade("--accent"), width: 1.5,
      value: (self, value) => bytes(value) },
    { label: "stacks", stroke: colour("--open"), width: 1.5,
      value: (self, value) => bytes(value) },
    { label: "goal", stroke: colour("--quiet"), width: 1, dash: [3, 3],
      value: (self, value) => bytes(value) },
  ], [
    ago,
    points.map((point) => point.heapBytes),
    points.map((point) => point.stackBytes),
    points.map((point) => point.goalBytes),
  ], { height: 130, format: bytes, axisWidth: 66 });

  chartOf(into, "allocating", "allocating per second", [
    when(),
    { label: "bytes/s", stroke: colour("--warn"), fill: shade("--warn"), width: 1.5,
      value: (self, value) => bytes(value) + "/s" },
  ], [ago, points.map((point) => point.bytesPerSecond)],
    { height: 110, format: bytes, axisWidth: 66 });

  chartOf(into, "compute", "compute", [
    when(),
    { label: "goroutines", stroke: colour("--open"), width: 1.5,
      value: (self, value) => String(value) },
    { label: "runnable", stroke: colour("--warn"), width: 1.5,
      value: (self, value) => String(value) },
    { label: "busy", stroke: colour("--accent"), width: 1.5, scale: "%",
      value: (self, value) => percent(value) },
  ], [
    ago,
    points.map((point) => point.goroutines),
    points.map((point) => point.runnable),
    points.map((point) => point.busy),
  ], { height: 130, format: (value) => String(Math.round(value)), axisWidth: 40 });
}

// when is the x series: the cursor reads a position off it, so it needs a name
// and a format. Left as uPlot's default it read "Value: -33.512", which says
// neither what the number is nor what it is measured in.
function when() {
  return {
    label: "when",
    value: (self, value) => value == null ? "--"
      : (value >= -0.05 ? "now" : Math.abs(value).toFixed(1) + "s ago"),
  };
}

// colour reads a token off the page, so the charts follow the viewer's theme
// rather than carrying a palette of their own.
function colour(token) {
  return getComputedStyle(document.documentElement).getPropertyValue(token).trim() || "#888";
}

function shade(token) {
  return "color-mix(in srgb, " + colour(token) + " 20%, transparent)";
}

function renderTable(into, columns, rows, cell, decorate) {
  into.replaceChildren();
  if (!rows || rows.length === 0) {
    into.appendChild(tagged("caption", "empty", "nothing"));
    return;
  }
  const head = document.createElement("tr");
  for (const column of columns) {
    head.appendChild(tagged("th", column.numeric ? "n" : "", column.name));
  }
  into.appendChild(head);
  for (const row of rows) {
    const line = document.createElement("tr");
    for (const column of columns) {
      line.appendChild(tagged("td", column.numeric ? "n" : "", cell(row, column.name)));
    }
    into.appendChild(line);
    if (decorate) decorate(line, row);
  }
}

const measurementColumns = [
  { name: "kind" }, { name: "operation" }, { name: "status" },
  { name: "count", numeric: true }, { name: "median", numeric: true },
  { name: "longest", numeric: true }, { name: "waited", numeric: true },
];

const routeColumns = [
  { name: "method" }, { name: "path" }, { name: "answers", numeric: true },
  { name: "summary" },
];

const costColumns = [
  { name: "name" }, { name: "kind" }, { name: "runs", numeric: true },
  { name: "per run, recent", numeric: true }, { name: "per run, all", numeric: true },
  { name: "allocs/run", numeric: true }, { name: "mean size", numeric: true },
  { name: "cpu", numeric: true }, { name: "longest", numeric: true },
];

// previous is the reading before the current one, kept so a marginal figure
// can be worked out from two cumulative ones.
//
// The account is cumulative, so its per-run is a lifetime average and lags
// what a route costs now: measured here, a route settled at 1.16MiB per run
// while the average was still climbing through 920KiB. The difference between
// two readings is the answer to "what does it cost now", and only a reader
// holding both can take it.
let previous = null;

function marginal(row) {
  if (!previous) return null;
  for (const before of previous.costs || []) {
    if (before.name !== row.name) continue;
    const runs = row.times - before.times;
    if (runs <= 0) return null;
    return (row.allocatedDuring - before.allocatedDuring) / runs;
  }
  return null;
}

// The selected name: whose aggregate the box under the table is about.
//
// Kept for the same reason the chosen trace is: a table that reordered itself
// under a selection -- and it does, the rows are sorted by what allocated most
// -- would move the answer away from whoever asked for it.
let selected = null;
const selectedName = "effect-golang-inspect-selected";

function select(name) {
  selected = name;
  try {
    localStorage.setItem(selectedName, name);
  } catch (whatever) { /* storage denied; the selection lives for this page */ }
  drawn.delete("account");
  el("accountchart").replaceChildren();
  redraw();
}

try {
  selected = localStorage.getItem(selectedName) || null;
} catch (whatever) { /* unreadable; the busiest name is selected instead */ }

// kindOf says what a name is, from what the reading itself contains: a name
// the surface declares is a route, one the transports name is a phase, and
// the rest is work a program named for itself.
//
// Derived rather than carried, because the account is keyed by name and by
// nothing else -- which is what lets a route, a phase and a stage be compared
// in one table.
function kindOf(name) {
  if (name === "other") return "undeclared";
  if (["decoding", "handling", "encoding"].includes(name)) return "phase";
  const routes = (latest && latest.routes) || [];
  if (routes.some((route) => route.method + " " + route.path === name)) return "route";
  // The inspector's own routes are not in the surface it is watching, and
  // saying "named work" of them hid the one thing worth knowing about them.
  if (mounted && name.includes(" " + mounted)) return "inspector";
  return "named work";
}

// renderAccount is the aggregate the span details leave out: what every run of
// one name cost, and how the runs are spread.
function renderAccount(costs) {
  const rows = costs || [];
  const account = rows.find((cost) => cost.name === selected) || rows[0] || null;
  el("accountname").textContent = account
    ? account.name + "  \u00b7  " + kindOf(account.name)
    : "";
  const facts = el("accountfacts");
  facts.replaceChildren();
  el("accountbands").replaceChildren();
  if (!account) {
    facts.appendChild(tagged("dd", "empty", "nothing accounted yet"));
    return;
  }
  const say = (term, value) => {
    facts.appendChild(tagged("dt", null, term));
    facts.appendChild(tagged("dd", null, value));
  };
  say("runs accounted", String(account.times));
  say("per run", bytes(account.perRunBytes) + " in " +
    (account.objectsPerRun || 0) + " allocation(s)");
  const recent = marginal(account);
  if (recent !== null) say("per run, since the last reading", bytes(recent));
  if (account.meanObjectBytes) say("mean allocation", bytes(account.meanObjectBytes));
  say("longest run", micros(account.longestMicros));
  if (account.cpuSecondsDuring) {
    say("cpu during", (1000 * account.cpuSecondsDuring).toFixed(1) + "ms");
  }
  if (account.collections) say("collections during", String(account.collections));
  renderSizes(el("accountbands"), account);
  renderRuns(el("accountchart"), account);
}

// renderRuns draws the runs still in the window, newest at the right: an
// average says what a name costs and this says whether it costs that every
// time.
//
// Go flushes a P's allocation accounting in batches, so short runs read as
// zero and the run after them carries what they allocated. That is why the
// spread is worth drawing rather than summarising: a column of zeros with
// spikes in it is a measurement artefact, and a rising line is not.
function renderRuns(into, account) {
  if (typeof uPlot === "undefined") return;
  const runs = (account.runs || []).slice().reverse();
  if (runs.length < 2) {
    into.replaceChildren(tagged("p", "empty", "one run or none in the window"));
    return;
  }
  const at = runs.map((run, index) => index - (runs.length - 1));
  chartOf(into, "account", "allocated per run  (" + account.name + ")",
    [
      { label: "runs ago",
        value: (self, value) => value == null ? "--"
          : (value >= -0.5 ? "latest" : Math.abs(Math.round(value)) + " back") },
      { label: "allocated", stroke: colour("--accent"), width: 1.5,
        fill: shade("--accent"),
        value: (self, value) => value == null ? "--" : bytes(value) },
    ],
    [at, runs.map((run) => run.bytes)],
    { height: 120, format: (value) => bytes(value), axisWidth: 62 });
}

function renderCosts(into, caveat, costs) {
  // One clause. What it means for reading the numbers: the figure is
  // everything the process allocated while that name's work ran, so two
  // overlapping requests are each charged for both -- a bound on what a name
  // costs and not its share.
  caveat.textContent = costs && costs.length
    ? "allocated by the whole process while each name's work ran"
    : "";
  renderCostRows(into, costs);
}

// The size classes, disclosed under the row they belong to.
//
// A row carries the bytes and the count, which is what a reader wants first.
// What shapes those allocations were is the second question, and sixty-eight
// buckets in every row would bury the first.
// renderSizes discloses what shapes a name's allocations were, per run.
//
// Per run because the row above it is: the account sums the bands over every
// run, and eighty thousand small allocations beside a per-run figure of three
// kilobytes read as one allocation in eighty thousand pieces.
function renderSizes(into, row) {
  const classes = row.sizes || [];
  if (classes.length === 0) return;
  const runs = Math.max(1, row.times || 1);
  const most = Math.max(...classes.map((one) => one.count), 1);
  const held = tagged("div", "classes");
  for (const one of classes) {
    const each = one.count / runs;
    held.appendChild(tagged("div", "edge",
      one.atMostBytes ? "\u2264 " + bytes(one.atMostBytes) : "larger"));
    const weight = tagged("div", "weight");
    weight.style.width = Math.max(1, 100 * one.count / most) + "%";
    weight.title = one.count + " allocation(s) over " + runs + " run(s)";
    held.appendChild(weight);
    held.appendChild(tagged("div", "edge",
      each < 1 ? "<1" : String(Math.round(each))));
  }
  held.appendChild(tagged("div", "edge", ""));
  held.appendChild(tagged("div", "legend", "allocations per run, by size"));
  into.appendChild(held);
}

function renderCostRows(into, costs) {
  renderTable(into, costColumns, costs, (row, column) => {
    switch (column) {
      case "name": return row.name;
      case "kind": return kindOf(row.name);
      case "runs": return row.times;
      case "per run, recent": {
        const recent = marginal(row);
        return recent === null ? "-" : bytes(recent);
      }
      case "per run, all": return bytes(row.perRunBytes);
      case "allocs/run": return row.objectsPerRun || "-";
      case "mean size": return bytes(row.meanObjectBytes);
      case "cpu": return row.cpuSecondsDuring
        ? (1000 * row.cpuSecondsDuring).toFixed(1) + "ms" : "-";
      case "longest": return micros(row.longestMicros);
    }
  }, (line, row) => {
    // A row selects: what it discloses is in the box under the table, where
    // it holds still and has room for the spread as well as the numbers.
    line.classList.add("selectable");
    const shown = row.name === selected;
    line.classList.toggle("chosen", shown);
    line.setAttribute("aria-current", String(shown));
    line.addEventListener("click", () => select(row.name));
  });
}

function render(snapshot) {
  el("taken").textContent = "read at " + new Date(snapshot.takenAt).toLocaleTimeString();
  el("dropped").textContent = snapshot.dropped
    ? snapshot.dropped + " dropped"
    : "";
  previous = latest === snapshot ? previous : latest;
  latest = snapshot;
  renderGauges(el("gauges"), snapshot.process);
  renderCharts(el("charts"), snapshot.process);
  renderCosts(el("costs"), el("costcaveat"), snapshot.costs);
  renderAccount(snapshot.costs);
  renderFibers(el("fibers"), snapshot.fibers);
  el("owned").textContent = snapshot.owned && snapshot.owned.counted
    ? snapshot.owned.fibers + " fiber(s), " + snapshot.owned.resources +
      " resource(s) owned"
    : "not counting (needs debug tracking)";
  renderOpen(el("open"), snapshot.openSpans);
  const all = tracesOf(snapshot.trace);
  const traces = el("own").checked ? all : all.filter((trace) => !ownTrace(trace));
  const hidden = all.length - traces.length;
  el("hidden").textContent = hidden
    ? hidden + " of the inspector's own hidden \u2014 its load is still in the statistics"
    : "";
  const showing = chosenIn(traces);
  renderTraces(el("traces"), traces, showing);
  renderHot(el("hot"), traces);
  renderWaterfall(el("waterfall"), el("details"), showing, snapshot.costs);
  el("loose").textContent = snapshot.looseEvents
    ? snapshot.looseEvents + " event(s) outside every span"
    : "";
  renderTable(el("measurements"), measurementColumns, snapshot.measurements, (row, column) => {
    switch (column) {
      case "kind": return row.kind;
      case "operation": return row.operation;
      case "status": return row.status || "-";
      case "count": return row.count;
      case "median": return micros(row.medianMicros) || "-";
      case "longest": return micros(row.maxMicros) || "-";
      case "waited": return micros(row.waitedMicros) || "-";
    }
  });
  renderRoutes(el("routes"), snapshot.routes);
}

// The surface, with the paths that can be opened as links.
//
// A GET whose pattern captures nothing is a URL: it can be followed. One with
// a {capture} is a pattern and not an address, and a link to it would 404 --
// so it stays text, and the pattern is what a reader wanted to see anyway.
function renderRoutes(into, routes) {
  into.replaceChildren();
  if (!routes || routes.length === 0) {
    into.appendChild(tagged("caption", "empty", "none declared"));
    return;
  }
  const head = document.createElement("tr");
  for (const column of routeColumns) {
    head.appendChild(tagged("th", column.numeric ? "n" : "", column.name));
  }
  into.appendChild(head);
  for (const route of routes) {
    const line = document.createElement("tr");
    line.appendChild(tagged("td", "", route.method));
    const path = tagged("td", "");
    if (route.method === "GET" && !route.path.includes("{")) {
      const link = document.createElement("a");
      link.href = route.path;
      link.target = "_blank";
      link.rel = "noreferrer";
      link.appendChild(text(route.path));
      path.appendChild(link);
    } else {
      path.appendChild(text(route.path));
    }
    line.appendChild(path);
    line.appendChild(tagged("td", "n", route.status));
    line.appendChild(tagged("td", "", route.summary || ""));
    into.appendChild(line);
  }
}

// The open spans, which are a list and not a timeline: each is still running,
// so there is no window to place them in.
function renderOpen(into, spans) {
  into.replaceChildren();
  if (!spans || spans.length === 0) {
    into.appendChild(tagged("p", "empty", "nothing"));
    return;
  }
  for (const span of spans) {
    const line = tagged("div", "span");
    line.appendChild(tagged("span", "name", span.name || "(unnamed)"));
    line.appendChild(text(" "));
    line.appendChild(tagged("span", statusClass(span), "open "));
    line.appendChild(tagged("span", "age", micros(span.ageMicros)));
    if (span.source) line.title = span.source;
    into.appendChild(line);
  }
}

// latest is the last snapshot, kept so choosing a trace redraws from it
// rather than waiting for the next refresh.
let latest = null;

function redraw() {
  if (latest) render(latest);
}

let reading = false;

async function read() {
  if (reading) return;
  reading = true;
  try {
    const response = await fetch(source, { headers: { accept: "application/json" } });
    if (!response.ok) throw new Error("the inspector answered " + response.status);
    render(await response.json());
    el("fault").textContent = "";
  } catch (whatever) {
    // Said rather than swallowed: an inspector that silently stops refreshing
    // looks exactly like a program that has stopped doing anything.
    el("fault").textContent = String(whatever.message || whatever);
  } finally {
    reading = false;
  }
}

let timer = null;

function pace() {
  if (timer !== null) clearInterval(timer);
  const every = Number(el("every").value);
  timer = every > 0 ? setInterval(read, every) : null;
}

// The library is fetched from this same server and nothing else is: no CDN,
// no font, no third party. A tool that only works where the internet is
// reachable is not a debugging tool.
function loaded() {
  return new Promise((resolve, reject) => {
    const style = document.createElement("link");
    style.rel = "stylesheet";
    style.href = mounted + "/uplot.css";
    document.head.appendChild(style);

    const script = document.createElement("script");
    script.src = mounted + "/uplot.js";
    script.onload = resolve;
    script.onerror = () => reject(new Error("the chart library could not be loaded"));
    document.head.appendChild(script);
  });
}

el("now").addEventListener("click", read);
el("every").addEventListener("change", pace);
// Choosing what to look at redraws from the reading in hand rather than
// waiting for the next one.
el("own").addEventListener("change", () => {
  chosen = { root: null, span: null, pinned: false, kept: null, measured: {} };
  remember();
  redraw();
});
// Reading while the tab is hidden is work nobody is looking at.
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    if (timer !== null) clearInterval(timer);
    timer = null;
    return;
  }
  read();
  pace();
});

// The charts need the library; nothing else does, so a failure to load it is
// reported and the rest of the page still renders.
loaded().catch((whatever) => {
  el("fault").textContent = String(whatever.message || whatever);
}).finally(() => {
  read();
  pace();
});
</script>
</body>
</html>
